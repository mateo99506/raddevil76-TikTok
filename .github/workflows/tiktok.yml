name: TikTok Scraper

on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository with PAT
      run: |
        git clone https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git repo
        ls -la repo

    - name: Ensure memory.txt exists
      run: |
        cd repo
        if [ ! -f memory.txt ]; then
          echo "Creating empty memory.txt"
          touch memory.txt
        fi

    - name: Ensure api_dump.txt exists
      run: |
        cd repo
        if [ ! -f api_dump.txt ]; then
          echo "Creating empty api_dump.txt"
          touch api_dump.txt
        fi

    - name: Install Python
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip imagemagick libheif1 libheif-dev libheif-examples
        python3 -m pip install --upgrade pip
        python3 -m pip install requests cloudscraper

    - name: Install HEIF support
      run: |
        sudo apt-get update
        sudo apt-get install -y libheif1 libheif-dev libheif-examples
    
    - name: Run TikTok scraper
      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      run: |
        cd repo
        python3 tiktok.py

    - name: Commit updated memory.txt
      run: |
        cd repo
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add memory.txt
        git commit -m "Update memory" || echo "No changes to memory"
        git pull --rebase https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git main || true
        git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git HEAD:main || true

    - name: Reset api_dump.txt with template
      run: |
        cd repo
        echo "https://www.tikwm.com/api/user/posts?unique_id=USER&count=AMOUNT" > api_dump.txt
        echo "" >> api_dump.txt
        echo "api_dump.txt has been reset with template."

    - name: Commit cleared api_dump.txt separately
      run: |
        cd repo
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add api_dump.txt
        git commit -m "Clear api_dump" || echo "Empty api_dump"
        git pull --rebase https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git main || true
        git push https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git HEAD:main || true
